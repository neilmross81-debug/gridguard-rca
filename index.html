<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Investigator — Industrial Root Cause Analysis</title>
<meta name="description" content="Root cause analysis and corrective action tracking for HV and renewable operations.">
<meta name="theme-color" content="#F3F2F1">

</head>
<body>

<header class="nav" id="appHeader">
  <div class="wrap nav-inner">
    <a class="brand" href="#/" aria-label="Asset Investigator home">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Asset Investigator</span>
        <span class="brand-sub">HV &amp; Renewable Operations</span>
      </span>
    </a>

    <nav class="nav-links" id="navLinks">
      <button class="nav-link" data-route="#/">Dashboard</button>
      <button class="nav-link" data-route="#/investigations">Investigations</button>
      <button class="nav-link" data-route="#/capas">CAPA Actions</button>
      <button class="nav-link" data-route="#/admin" id="adminNavBtn" style="display:none">Sites &amp; Users</button>
    </nav>

    <div class="nav-right">
      <button class="sync-pill" id="syncBtn" title="Cloud sync status — click to refresh" aria-label="Cloud sync status">
        <span class="sync-dot"></span>
        <span class="sync-text">Syncing…</span>
      </button>
      <button class="btn btn-primary" id="newRcaBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New RCA
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
        </svg>
      </button>
      <div id="userChipHost"></div>
    </div>
  </div>
</header>

<div id="landingHost"></div>
<main id="view" class="wrap page"></main>

<div id="modalHost"></div>
<div id="dropdownHost"></div>
<div class="toast-host" id="toastHost"></div>

<template id="modalTpl">
  <div class="overlay" data-overlay>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div><div class="eyebrow" data-eyebrow></div><h2 class="h2" data-title></h2></div>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" data-body></div>
      <div class="modal-foot" data-foot></div>
    </div>
  </div>
</template>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script src="assets/app.js?v=28"></script>
</body>
</html>
